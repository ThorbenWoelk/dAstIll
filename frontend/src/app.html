<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>dAstIll</title>
    <meta
      name="description"
      content="Your subscribed channels, printed as a calm morning paper."
    />
    <meta
      name="theme-color"
      content="#f1ece1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#161513"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="application-name" content="dAstIll" />
    <meta name="apple-mobile-web-app-title" content="dAstIll" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
