[package]
name = "dastill"
version = "0.3.1"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
logfire = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for YouTube/Ollama/local ASR
reqwest = { version = "0.12", features = ["json", "multipart"] }

# RSS parsing
rss = "2"
roxmltree = "0.20"

# HTML parsing for channel resolution
scraper = "0.26.0"

# Async utilities
thiserror = "2"
anyhow = "1"

# libSQL-backed full-text search
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
rig-core = "0.28.0"
sha2 = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"

# Types generation
ts-rs = { version = "10.0", features = ["chrono-impl"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

# AWS S3 + S3 Vectors
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-login", "credentials-process", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "rt-tokio", "sigv4a"] }
aws-sdk-s3vectors = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-types = "1"
aws-smithy-http-client = { version = "1.1.12", default-features = false, features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-credential-types = "1.2.11"

aws-sdk-polly = { version = "1", default-features = false, features = ["http-1x", "rt-tokio"] }

# Firebase Auth token verification
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }

# TLS crypto provider — ring is proven on the Cloud Run bookworm-slim image
rustls = { version = "0.23", features = ["ring"] }


[dev-dependencies]
tempfile = "3"
tower = "0.5"
http-body-util = "0.1"
