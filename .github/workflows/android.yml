name: Android APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android.yml"
      - "frontend/**"
      - "src-tauri/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to attach the APK to"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  APP_NAME: dastill
  DOCS_URL_OVERRIDE: ${{ vars.DOCS_URL }}

permissions:
  contents: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Resolve frontend build configuration
        run: |
          set -euo pipefail

          backend_url="$(gcloud run services describe "${APP_NAME}-backend" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          docs_url="${DOCS_URL_OVERRIDE:-https://${PROJECT_ID}-docs.web.app}"
          firebase_api_key="$(gcloud secrets versions access latest --secret="${APP_NAME}-firebase-web-api-key")"
          firebase_auth_domain="$(gcloud secrets versions access latest --secret="${APP_NAME}-firebase-auth-domain")"

          {
            echo "VITE_API_BASE=$backend_url"
            echo "PUBLIC_DOCS_URL=$docs_url"
            echo "PUBLIC_CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}"
            echo "PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID"
            echo "PUBLIC_FIREBASE_API_KEY=$firebase_api_key"
            echo "PUBLIC_FIREBASE_AUTH_DOMAIN=$firebase_auth_domain"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "ndk;28.2.13676358" "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Write Android signing config
        run: |
          set -euo pipefail
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_B64 }}" > "$RUNNER_TEMP/dastill-android.jks"
          echo "storeFile=$RUNNER_TEMP/dastill-android.jks" >> keystore.properties

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: cargo tauri android build --apk

      - name: Prepare APK asset
        id: apk_asset
        run: |
          set -euo pipefail

          apk_root="src-tauri/gen/android/app/build/outputs/apk"
          apk_path="$(find "$apk_root" -type f -path '*/release/*.apk' | sort | head -n 1)"
          if [ -z "$apk_path" ]; then
            echo "No release APK found under $apk_root" >&2
            find "$apk_root" -maxdepth 4 -type f 2>/dev/null >&2 || true
            exit 1
          fi

          release_tag="${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}"
          if [ -z "$release_tag" ]; then
            release_tag="${GITHUB_SHA}"
          fi
          safe_tag="${release_tag//\//-}"

          mkdir -p dist/android
          asset_path="dist/android/dAstIll-${safe_tag}-android.apk"
          cp "$apk_path" "$asset_path"

          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk_asset.outputs.asset_path }}

      - name: Attach APK to GitHub release
        if: github.event_name == 'release' || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          files: ${{ steps.apk_asset.outputs.asset_path }}
          fail_on_unmatched_files: true
