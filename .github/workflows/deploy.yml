name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && 'Release (manual)'
      || format('Release: {0}', github.event.head_commit.message || 'unknown message')
  }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  APP_NAME: dastill
  REPO_ID: dastill
  DEPLOY_SHA: ${{ github.sha }}
  DOCS_URL_OVERRIDE: ${{ vars.DOCS_URL }}
  FRONTEND_URL_OVERRIDE: ${{ vars.FRONTEND_URL }}
  LOCAL_ASR_ENABLED: ${{ vars.LOCAL_ASR_ENABLED || 'true' }}
  LOCAL_ASR_BASE_URL: ${{ vars.LOCAL_ASR_BASE_URL }}
  LOCAL_ASR_MODEL: ${{ vars.LOCAL_ASR_MODEL }}
  LOCAL_ASR_MAX_AUDIO_BYTES: ${{ vars.LOCAL_ASR_MAX_AUDIO_BYTES }}
  LOCAL_ASR_TIMEOUT_SECS: ${{ vars.LOCAL_ASR_TIMEOUT_SECS }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  runtime-mode:
    name: Runtime Mode
    runs-on: ubuntu-latest
    outputs:
      app_runtime_mode: ${{ steps.mode.outputs.app_runtime_mode }}
      maintenance_mode: ${{ steps.mode.outputs.maintenance_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Resolve runtime mode
        id: mode
        run: |
          set -euo pipefail

          mode="$(node ./scripts/resolve-runtime-mode.mjs .github/runtime-mode.env)"
          if [ -z "$mode" ]; then
            mode="live"
          fi

          maintenance_mode=false
          if [ "$mode" = "maintenance" ]; then
            maintenance_mode=true
          fi

          {
            echo "app_runtime_mode=$mode"
            echo "maintenance_mode=$maintenance_mode"
          } >> "$GITHUB_OUTPUT"

  detect-changes:
    name: Detect Deploy Changes
    runs-on: ubuntu-latest
    needs:
      - runtime-mode
    outputs:
      infra: ${{ steps.changes.outputs.infra }}
      backend: ${{ steps.changes.outputs.backend }}
      docs: ${{ steps.changes.outputs.docs }}
      frontend: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            {
              echo "infra=false"
              echo "backend=true"
              echo "docs=true"
              echo "frontend=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            before_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$before_sha" ]; then
            {
              echo "infra=false"
              echo "backend=true"
              echo "docs=true"
              echo "frontend=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$before_sha" "$GITHUB_SHA")"

          infra=false
          backend=false
          docs=false
          frontend=false

          while IFS= read -r path; do
            case "$path" in
              terraform/*|.github/workflows/infra.yml)
                infra=true
                ;;
              backend/*)
                backend=true
                ;;
              firebase.json|.firebaserc)
                docs=true
                frontend=true
                ;;
              docs/*)
                docs=true
                ;;
              frontend/*)
                frontend=true
                ;;
              *)
                # Unrecognized paths (root files, .github/, etc.) could affect
                # any service — deploy everything to be safe.
                backend=true
                docs=true
                frontend=true
                ;;
            esac
          done <<EOF
          $changed_files
          EOF

          {
            echo "infra=$infra"
            echo "backend=$backend"
            echo "docs=$docs"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs:
      - runtime-mode
    uses: ./.github/workflows/validation.yml
    with:
      run_backend: true
      run_frontend: true
      run_docs: true

  wait-for-infra:
    name: Wait For Infra
    needs:
      - detect-changes
      - checks
    if: github.event_name == 'push' && needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Wait for infra workflow completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 180); do
            run_json="$(gh api "/repos/${REPOSITORY}/actions/workflows/infra.yml/runs?event=push&head_sha=${TARGET_SHA}&per_page=1")"
            run_count="$(jq '.workflow_runs | length' <<<"$run_json")"

            if [ "$run_count" -eq 0 ]; then
              sleep 10
              continue
            fi

            run_status="$(jq -r '.workflow_runs[0].status' <<<"$run_json")"
            run_conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$run_json")"

            if [ "$run_status" != "completed" ]; then
              sleep 10
              continue
            fi

            if [ "$run_conclusion" = "success" ]; then
              echo "Infra workflow completed successfully for ${TARGET_SHA}."
              exit 0
            fi

            echo "::error::Infra workflow concluded with ${run_conclusion:-unknown} for ${TARGET_SHA}."
            exit 1
          done

          echo "::error::Timed out waiting for infra workflow on ${TARGET_SHA}."
          exit 1

  deploy-backend:
    name: Deploy Backend
    needs:
      - runtime-mode
      - detect-changes
      - checks
      - wait-for-infra
    if: always() && needs.checks.result == 'success' && needs.detect-changes.outputs.backend == 'true' && needs.wait-for-infra.result != 'failure' && needs.wait-for-infra.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and Push ASR Image
        if: env.LOCAL_ASR_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./asr
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/asr:${{ env.IMAGE_TAG }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/backend:${{ env.IMAGE_TAG }}

      - name: Prepare backend Cloud Run secrets
        id: backend_secrets
        run: |
          set -euo pipefail
          {
            echo "OPEN_ALEX_API_KEY=${APP_NAME}-openalex-api-key:latest"
            echo "YOUTUBE_API_KEY=${APP_NAME}-youtube-api-key:latest"
            echo "OLLAMA_API_KEY=${APP_NAME}-ollama-api-key:latest"
            echo "LOGFIRE_TOKEN=${APP_NAME}-logfire-token:latest"
            echo "BACKEND_PROXY_TOKEN=${APP_NAME}-backend-proxy-token:latest"
            echo "DATABRICKS_TOKEN=${APP_NAME}-databricks-token:latest"
          } > /tmp/backend_cr_secrets.txt
          {
            echo 'secrets<<CR_SECRETS_EOF'
            cat /tmp/backend_cr_secrets.txt
            echo 'CR_SECRETS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Deploy ASR to Cloud Run
        if: env.LOCAL_ASR_ENABLED == 'true'
        id: deploy_asr
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-asr', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/asr:${{ env.IMAGE_TAG }}
          flags: "--service-account=${{ env.APP_NAME }}-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --memory=2Gi --cpu=2 --concurrency=1 --max-instances=1 --timeout=3600 --port=5092 --startup-probe=tcpSocket.port=5092,failureThreshold=18,periodSeconds=10"

      - name: Prepare backend Cloud Run env vars
        run: |
          set -euo pipefail

          env_file=/tmp/backend_cr_env.txt
          : > "$env_file"
          allowed_origins="https://${PROJECT_ID}.web.app,https://${PROJECT_ID}.firebaseapp.com,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3543,http://127.0.0.1:3543"

          if [ -n "${FRONTEND_URL_OVERRIDE:-}" ]; then
            allowed_origins="${allowed_origins},${FRONTEND_URL_OVERRIDE}"
          fi

          yaml_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          add_env_var() {
            local key="$1"
            local value="${2:-}"
            value="$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$value" ]; then
              printf '%s: "%s"\n' "$key" "$(yaml_escape "$value")" >> "$env_file"
            fi
          }

          add_env_var AWS_REGION "eu-central-1"
          add_env_var AWS_ROLE_ARN "arn:aws:iam::877173393100:role/dastill-gcp-backend"
          add_env_var AWS_WIF_AUDIENCE "105579049790067983119"
          add_env_var S3_DATA_BUCKET "dastill-data-eu-central-1"
          add_env_var S3_VECTOR_BUCKET "dastill-vectors"
          add_env_var S3_VECTOR_INDEX "search-chunks"
          add_env_var DEFAULT_SEEDED_CHANNEL_IDS "UCbRP3c757lWg9M-U7TyEkXA,podcast:rss:https-feeds-simplecast-com-6hkohngs"
          add_env_var SEARCH_SEMANTIC_ENABLED "true"
          add_env_var SEARCH_AUTO_CREATE_VECTOR_INDEX "true"
          add_env_var OLLAMA_URL "https://ollama.com"
          add_env_var OLLAMA_SUMMARY_MODEL "glm-5.1:cloud"
          add_env_var OLLAMA_DEFAULT_CHAT_MODEL "glm-5.1:cloud"
          add_env_var OLLAMA_EMBEDDING_MODEL "embeddinggemma"
          add_env_var SEARCH_HYDE_MODEL "glm-5.1:cloud"
          add_env_var SEARCH_RERANK_MODEL "bge-reranker-v2-m3"
          add_env_var SUMMARY_EVALUATOR_MODEL "gemma4:31b-cloud"
          add_env_var CHAT_MULTI_PASS_ENABLED "true"
          add_env_var CHAT_GUARDRAIL_MODEL "glm-5.1:cloud"
          add_env_var CHAT_PROMPT_BLOCKLIST "ignore previous instructions,reveal system prompt"
          add_env_var CHAT_PROMPT_ALLOWLIST "security training,prompt injection examples"
          add_env_var DATABRICKS_HOST "https://dbc-7a303243-287b.cloud.databricks.com"
          add_env_var DATABRICKS_WAREHOUSE_ID "769c25a6f2a3bf22"
          add_env_var DATABRICKS_CATALOG "workspace"
          add_env_var DATABRICKS_SCHEMA "analytics"
          add_env_var DATABRICKS_BRONZE_TABLE "bronze_app_events"
          add_env_var LOCAL_ASR_ENABLED "${LOCAL_ASR_ENABLED:-false}"
          if [ "${LOCAL_ASR_ENABLED:-false}" = "true" ]; then
            add_env_var LOCAL_ASR_BASE_URL "${{ steps.deploy_asr.outputs.url }}/v1"
            add_env_var LOCAL_ASR_AUTH_MODE "google_id_token"
          else
            add_env_var LOCAL_ASR_BASE_URL "${LOCAL_ASR_BASE_URL:-}"
          fi
          add_env_var LOCAL_ASR_MODEL "${LOCAL_ASR_MODEL:-whisper-base.en}"
          add_env_var LOCAL_ASR_MAX_AUDIO_BYTES "${LOCAL_ASR_MAX_AUDIO_BYTES:-262144000}"
          add_env_var LOCAL_ASR_TIMEOUT_SECS "${LOCAL_ASR_TIMEOUT_SECS:-3600}"
          add_env_var BACKEND_CORS_ALLOWED_ORIGINS "$allowed_origins"
          add_env_var GCP_PROJECT_ID "$PROJECT_ID"
          printf '%s\n' 'SUMMARIZE_PATH: "/usr/local/bin/summarize"' >> "$env_file"
          printf '%s\n' 'POLLY_TTS_ENABLED: "true"' >> "$env_file"
          printf '%s\n' 'POLLY_TTS_VOICE_ID: "Stephen"' >> "$env_file"
          printf '%s\n' 'RUST_LOG: "dastill=info,tower_http=info"' >> "$env_file"

      - name: Deploy Backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-backend', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/backend:${{ env.IMAGE_TAG }}
          flags: "--service-account=${{ env.APP_NAME }}-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --memory=1Gi --timeout=3600 --env-vars-file=/tmp/backend_cr_env.txt --startup-probe=tcpSocket.port=3001,failureThreshold=15,periodSeconds=10"
          secrets: "${{ steps.backend_secrets.outputs.secrets }}"
          secrets_update_strategy: overwrite

  deploy-docs:
    name: Deploy Docs
    needs:
      - runtime-mode
      - detect-changes
      - checks
      - wait-for-infra
    if: always() && needs.checks.result == 'success' && needs.detect-changes.outputs.docs == 'true' && needs.wait-for-infra.result != 'failure' && needs.wait-for-infra.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Docs Dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build Docs
        working-directory: docs
        run: bun run build

      - name: Deploy Docs to Firebase Hosting
        run: bunx firebase-tools@15.12.0 deploy --only hosting:docs --project "$PROJECT_ID" --non-interactive

  deploy-frontend:
    name: Deploy Frontend
    needs:
      - runtime-mode
      - detect-changes
      - checks
      - wait-for-infra
      - deploy-backend
    if: always() && needs.checks.result == 'success' && needs.detect-changes.outputs.frontend == 'true' && needs.wait-for-infra.result != 'failure' && needs.wait-for-infra.result != 'cancelled' && needs.deploy-backend.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Resolve backend and docs URLs
        id: service_urls
        run: |
          set -euo pipefail

          backend_url="$(gcloud run services describe "${APP_NAME}-backend" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          docs_url="${DOCS_URL_OVERRIDE:-https://${PROJECT_ID}-docs.web.app}"

          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"
          echo "docs_url=$docs_url" >> "$GITHUB_OUTPUT"

      - name: Load frontend public build config
        id: frontend_build_env
        run: |
          set -euo pipefail

          firebase_api_key="$(gcloud secrets versions access latest --secret="${APP_NAME}-firebase-web-api-key")"
          firebase_auth_domain="$(gcloud secrets versions access latest --secret="${APP_NAME}-firebase-auth-domain")"

          {
            echo 'public_firebase_api_key<<EOF'
            printf '%s\n' "$firebase_api_key"
            echo 'EOF'
            echo 'public_firebase_auth_domain<<EOF'
            printf '%s\n' "$firebase_auth_domain"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build Frontend
        env:
          VITE_API_BASE: ${{ steps.service_urls.outputs.backend_url }}
          PUBLIC_API_BASE: ${{ steps.service_urls.outputs.backend_url }}
          PUBLIC_DOCS_URL: ${{ steps.service_urls.outputs.docs_url }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          PUBLIC_APP_MAINTENANCE_MODE: ${{ needs.runtime-mode.outputs.maintenance_mode == 'true' && '1' || '0' }}
          PUBLIC_FIREBASE_API_KEY: ${{ steps.frontend_build_env.outputs.public_firebase_api_key }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ steps.frontend_build_env.outputs.public_firebase_auth_domain }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        working-directory: frontend
        run: |
          bun run build

      - name: Deploy Frontend to Firebase Hosting
        run: bunx firebase-tools@15.12.0 deploy --only hosting:app --project "$PROJECT_ID" --non-interactive
