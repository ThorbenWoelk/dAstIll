name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && 'Release (manual)'
      || format('Release: {0}', github.event.head_commit.message || 'unknown message')
  }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  APP_NAME: dastill
  REPO_ID: dastill
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/validation.yml
    with:
      run_backend: true
      run_frontend: true
      run_docs: true

  deploy-backend:
    name: Deploy Backend
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/backend:${{ env.IMAGE_TAG }}

      - name: Prepare backend Cloud Run secrets
        id: backend_secrets
        run: |
          set -euo pipefail
          {
            echo "YOUTUBE_API_KEY=${APP_NAME}-youtube-api-key:latest"
            echo "OLLAMA_API_KEY=${APP_NAME}-ollama-api-key:latest"
            echo "LOGFIRE_TOKEN=${APP_NAME}-logfire-token:latest"
            echo "BACKEND_PROXY_TOKEN=${APP_NAME}-backend-proxy-token:latest"
            echo "TURSO_AUTH_TOKEN=${APP_NAME}-turso-auth-token:latest"
          } > /tmp/backend_cr_secrets.txt
          {
            echo 'secrets<<CR_SECRETS_EOF'
            cat /tmp/backend_cr_secrets.txt
            echo 'CR_SECRETS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare backend Cloud Run env vars
        run: |
          set -euo pipefail

          env_file=/tmp/backend_cr_env.txt
          : > "$env_file"

          yaml_escape() {
            printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
          }

          add_env_var() {
            local key="$1"
            local value="${2:-}"
            value="$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$value" ]; then
              printf '%s: "%s"\n' "$key" "$(yaml_escape "$value")" >> "$env_file"
            fi
          }

          add_env_var AWS_REGION "eu-central-1"
          add_env_var AWS_ROLE_ARN "arn:aws:iam::877173393100:role/dastill-gcp-backend"
          add_env_var AWS_WIF_AUDIENCE "105579049790067983119"
          add_env_var S3_DATA_BUCKET "dastill-data-eu-central-1"
          add_env_var S3_VECTOR_BUCKET "dastill-vectors"
          add_env_var S3_VECTOR_INDEX "search-chunks"
          add_env_var TURSO_DB_URL "libsql://dastill-totos-dbs.aws-eu-west-1.turso.io"
          add_env_var DEFAULT_SEEDED_CHANNEL_ID "UCbRP3c757lWg9M-U7TyEkXA"
          add_env_var SEARCH_SEMANTIC_ENABLED "true"
          add_env_var OLLAMA_URL "https://ollama.com"
          add_env_var OLLAMA_SUMMARY_MODEL "glm-5.1:cloud"
          add_env_var OLLAMA_DEFAULT_CHAT_MODEL "glm-5.1:cloud"
          add_env_var OLLAMA_EMBEDDING_MODEL "embeddinggemma"
          add_env_var SUMMARY_EVALUATOR_MODEL "deepseek-v3.1:671b-cloud"
          add_env_var BACKEND_CORS_ALLOWED_ORIGINS "https://dastill-frontend-x4m5feb54q-ey.a.run.app"
          add_env_var GCP_PROJECT_ID "$PROJECT_ID"
          printf '%s\n' 'SUMMARIZE_PATH: "/usr/local/bin/summarize"' >> "$env_file"
          printf '%s\n' 'POLLY_TTS_ENABLED: "true"' >> "$env_file"
          printf '%s\n' 'POLLY_TTS_VOICE_ID: "Stephen"' >> "$env_file"
          printf '%s\n' 'RUST_LOG: "dastill=info,tower_http=info"' >> "$env_file"

      - name: Deploy Backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-backend', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/backend:${{ env.IMAGE_TAG }}
          flags: "--service-account=${{ env.APP_NAME }}-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --memory=1Gi --env-vars-file=/tmp/backend_cr_env.txt --startup-probe=tcpSocket.port=3001,failureThreshold=15,periodSeconds=10"
          secrets: "${{ steps.backend_secrets.outputs.secrets }}"
          secrets_update_strategy: overwrite

  deploy-docs:
    name: Deploy Docs
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and Push Docs Image
        uses: docker/build-push-action@v6
        with:
          context: ./docs
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/docs:${{ env.IMAGE_TAG }}

      - name: Deploy Docs to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-docs', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/docs:${{ env.IMAGE_TAG }}
          flags: "--allow-unauthenticated --service-account=${{ env.APP_NAME }}-docs-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

  deploy-frontend:
    name: Deploy Frontend
    needs:
      - deploy-backend
      - deploy-docs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Resolve backend and docs URLs
        id: service_urls
        run: |
          set -euo pipefail

          backend_url="$(gcloud run services describe "${APP_NAME}-backend" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          docs_url="$(gcloud run services describe "${APP_NAME}-docs" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"

          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"
          echo "docs_url=$docs_url" >> "$GITHUB_OUTPUT"

      - name: Load frontend public build config
        id: frontend_build_env
        run: |
          set -euo pipefail

          firebase_api_key="$(gcloud secrets versions access latest --secret="${APP_NAME}-firebase-web-api-key")"
          firebase_auth_domain="$(gcloud secrets versions access latest --secret="${APP_NAME}-firebase-auth-domain")"

          {
            echo 'public_firebase_api_key<<EOF'
            printf '%s\n' "$firebase_api_key"
            echo 'EOF'
            echo 'public_firebase_auth_domain<<EOF'
            printf '%s\n' "$firebase_auth_domain"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Image
        env:
          VITE_API_BASE: ${{ steps.service_urls.outputs.backend_url }}
          PUBLIC_DOCS_URL: ${{ steps.service_urls.outputs.docs_url }}
          PUBLIC_FIREBASE_API_KEY: ${{ steps.frontend_build_env.outputs.public_firebase_api_key }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ steps.frontend_build_env.outputs.public_firebase_auth_domain }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build \
            --build-arg VITE_API_BASE="$VITE_API_BASE" \
            --build-arg PUBLIC_DOCS_URL="$PUBLIC_DOCS_URL" \
            --build-arg PUBLIC_FIREBASE_API_KEY="$PUBLIC_FIREBASE_API_KEY" \
            --build-arg PUBLIC_FIREBASE_AUTH_DOMAIN="$PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg PUBLIC_FIREBASE_PROJECT_ID="$PUBLIC_FIREBASE_PROJECT_ID" \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/frontend:$IMAGE_TAG ./frontend
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/frontend:$IMAGE_TAG

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-frontend', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/frontend:${{ env.IMAGE_TAG }}
          flags: "--service-account=${{ env.APP_NAME }}-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --port=8080"