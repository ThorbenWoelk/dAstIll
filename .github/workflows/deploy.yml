name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release ({0})', github.event.inputs.target || 'all')
      || format('Release: {0}', github.event.workflow_run.head_commit.message || github.event.head_commit.message || 'unknown message')
  }}

on:
  workflow_run:
    workflows: ["Validation"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy scope
        type: choice
        options:
          - all
          - backend
          - docs
          - frontend
        default: all

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  APP_NAME: dastill
  REPO_ID: dastill
  # workflow_run sets github.sha to the workflow file ref, not the triggering commit.
  # Use head_sha from the triggering run when available.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "Security passed"

  checks:
    name: Checks
    needs: gate
    uses: ./.github/workflows/validation.yml

  deploy-backend:
    name: Deploy Backend
    needs:
      - checks
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and Push Backend Image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/backend:$IMAGE_TAG ./backend
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/backend:$IMAGE_TAG

      # Mount DATABRICKS_TOKEN only when Databricks is configured. Otherwise Cloud Run
      # still resolves :latest and fails if the secret has no enabled versions.
      - name: Prepare backend Cloud Run secrets
        id: backend_secrets
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          TURSO_DB_URL: ${{ vars.TURSO_DB_URL }}
        run: |
          set -euo pipefail
          databricks_host="$(printf '%s' "$DATABRICKS_HOST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          turso_db_url="$(printf '%s' "$TURSO_DB_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          {
            echo "YOUTUBE_API_KEY=${APP_NAME}-youtube-api-key:latest"
            echo "OLLAMA_API_KEY=${APP_NAME}-ollama-api-key:latest"
            echo "LOGFIRE_TOKEN=${APP_NAME}-logfire-token:latest"
            echo "BACKEND_PROXY_TOKEN=${APP_NAME}-backend-proxy-token:latest"
            if [ -n "$turso_db_url" ]; then
              echo "TURSO_AUTH_TOKEN=${APP_NAME}-turso-auth-token:latest"
            fi
            if [ -n "$databricks_host" ]; then
              echo "DATABRICKS_TOKEN=${APP_NAME}-databricks-token:latest"
            fi
          } > /tmp/backend_cr_secrets.txt
          {
            echo 'secrets<<CR_SECRETS_EOF'
            cat /tmp/backend_cr_secrets.txt
            echo 'CR_SECRETS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare backend Cloud Run env vars
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_WIF_AUDIENCE: ${{ vars.AWS_WIF_AUDIENCE }}
          S3_DATA_BUCKET: ${{ vars.S3_DATA_BUCKET }}
          S3_VECTOR_BUCKET: ${{ vars.S3_VECTOR_BUCKET }}
          S3_VECTOR_INDEX: ${{ vars.S3_VECTOR_INDEX }}
          TURSO_DB_URL: ${{ vars.TURSO_DB_URL }}
          DEFAULT_SEEDED_CHANNEL_ID: ${{ vars.DEFAULT_SEEDED_CHANNEL_ID || 'UCbRP3c757lWg9M-U7TyEkXA' }}
          SEARCH_SEMANTIC_ENABLED: ${{ vars.SEARCH_SEMANTIC_ENABLED || 'true' }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          OLLAMA_SUMMARY_MODEL: ${{ vars.OLLAMA_SUMMARY_MODEL }}
          OLLAMA_DEFAULT_CHAT_MODEL: ${{ vars.OLLAMA_DEFAULT_CHAT_MODEL || vars.OLLAMA_SUMMARY_MODEL }}
          OLLAMA_EMBEDDING_MODEL: ${{ vars.OLLAMA_EMBEDDING_MODEL }}
          SUMMARY_EVALUATOR_MODEL: ${{ vars.SUMMARY_EVALUATOR_MODEL }}
          BACKEND_CORS_ALLOWED_ORIGINS: ${{ vars.BACKEND_CORS_ALLOWED_ORIGINS }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
          DATABRICKS_SCHEMA: ${{ vars.DATABRICKS_SCHEMA }}
          DATABRICKS_BRONZE_TABLE: ${{ vars.DATABRICKS_BRONZE_TABLE }}
        run: |
          set -euo pipefail

          env_file=/tmp/backend_cr_env.txt
          : > "$env_file"

          add_env_var() {
            local key="$1"
            local value="${2:-}"
            value="$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$env_file"
            fi
          }

          add_env_var AWS_REGION "$AWS_REGION"
          add_env_var AWS_ROLE_ARN "$AWS_ROLE_ARN"
          add_env_var AWS_WIF_AUDIENCE "$AWS_WIF_AUDIENCE"
          add_env_var S3_DATA_BUCKET "$S3_DATA_BUCKET"
          add_env_var S3_VECTOR_BUCKET "$S3_VECTOR_BUCKET"
          add_env_var S3_VECTOR_INDEX "$S3_VECTOR_INDEX"
          add_env_var TURSO_DB_URL "$TURSO_DB_URL"
          add_env_var DEFAULT_SEEDED_CHANNEL_ID "$DEFAULT_SEEDED_CHANNEL_ID"
          add_env_var SEARCH_SEMANTIC_ENABLED "$SEARCH_SEMANTIC_ENABLED"
          add_env_var OLLAMA_URL "$OLLAMA_URL"
          add_env_var OLLAMA_SUMMARY_MODEL "$OLLAMA_SUMMARY_MODEL"
          add_env_var OLLAMA_DEFAULT_CHAT_MODEL "$OLLAMA_DEFAULT_CHAT_MODEL"
          add_env_var OLLAMA_EMBEDDING_MODEL "$OLLAMA_EMBEDDING_MODEL"
          add_env_var SUMMARY_EVALUATOR_MODEL "$SUMMARY_EVALUATOR_MODEL"
          add_env_var BACKEND_CORS_ALLOWED_ORIGINS "$BACKEND_CORS_ALLOWED_ORIGINS"
          add_env_var DATABRICKS_HOST "$DATABRICKS_HOST"
          add_env_var DATABRICKS_WAREHOUSE_ID "$DATABRICKS_WAREHOUSE_ID"
          add_env_var DATABRICKS_CATALOG "$DATABRICKS_CATALOG"
          add_env_var DATABRICKS_SCHEMA "$DATABRICKS_SCHEMA"
          add_env_var DATABRICKS_BRONZE_TABLE "$DATABRICKS_BRONZE_TABLE"
          add_env_var GCP_PROJECT_ID "$PROJECT_ID"
          printf '%s\n' 'SUMMARIZE_PATH=/usr/local/bin/summarize' >> "$env_file"
          printf '%s\n' 'POLLY_TTS_ENABLED=true' >> "$env_file"
          printf '%s\n' 'POLLY_TTS_VOICE_ID=Stephen' >> "$env_file"
          printf '%s\n' 'RUST_LOG=dastill=info,tower_http=info' >> "$env_file"

      - name: Deploy Backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-backend', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/backend:${{ env.IMAGE_TAG }}
          flags: "--service-account=${{ env.APP_NAME }}-backend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --memory=1Gi"
          # Quote so newlines from the prior step are preserved for deploy-cloudrun.
          secrets: "${{ steps.backend_secrets.outputs.secrets }}"
          secrets_update_strategy: overwrite
          env_vars_file: /tmp/backend_cr_env.txt
          env_vars_update_strategy: overwrite

  deploy-docs:
    name: Deploy Docs
    needs:
      - checks
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build and Push Docs Image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/docs:$IMAGE_TAG ./docs
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/docs:$IMAGE_TAG

      - name: Deploy Docs to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-docs', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/docs:${{ env.IMAGE_TAG }}
          flags: "--allow-unauthenticated --service-account=${{ env.APP_NAME }}-docs-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

  deploy-frontend:
    name: Deploy Frontend
    needs:
      - checks
      - deploy-backend
      - deploy-docs
    if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend') && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.deploy-docs.result == 'success' || needs.deploy-docs.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Google Auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.0

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Resolve backend and docs URLs
        id: service_urls
        env:
          DEPLOYED_BACKEND_URL: ${{ needs.deploy-backend.outputs.url }}
          DEPLOYED_DOCS_URL: ${{ needs.deploy-docs.outputs.url }}
        run: |
          set -euo pipefail

          backend_url="$DEPLOYED_BACKEND_URL"
          docs_url="$DEPLOYED_DOCS_URL"

          if [ -z "$backend_url" ]; then
            backend_url="$(gcloud run services describe "${APP_NAME}-backend" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          fi

          if [ -z "$docs_url" ]; then
            docs_url="$(gcloud run services describe "${APP_NAME}-docs" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          fi

          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"
          echo "docs_url=$docs_url" >> "$GITHUB_OUTPUT"

      - name: Build and Push Frontend Image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/frontend:$IMAGE_TAG ./frontend
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_ID/frontend:$IMAGE_TAG

      - name: Prepare frontend Cloud Run env vars
        env:
          BACKEND_API_BASE: ${{ steps.service_urls.outputs.backend_url }}
          BACKEND_IDENTITY_AUDIENCE: ${{ steps.service_urls.outputs.backend_url }}
          PUBLIC_DOCS_URL: ${{ steps.service_urls.outputs.docs_url }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          set -euo pipefail

          env_file=/tmp/frontend_cr_env.txt
          : > "$env_file"

          add_env_var() {
            local key="$1"
            local value="${2:-}"
            value="$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$key" "$value" >> "$env_file"
            fi
          }

          add_env_var BACKEND_API_BASE "$BACKEND_API_BASE"
          add_env_var BACKEND_IDENTITY_AUDIENCE "$BACKEND_IDENTITY_AUDIENCE"
          add_env_var PUBLIC_DOCS_URL "$PUBLIC_DOCS_URL"
          add_env_var PUBLIC_CONTACT_EMAIL "$PUBLIC_CONTACT_EMAIL"
          add_env_var PUBLIC_FIREBASE_PROJECT_ID "$PROJECT_ID"

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3.0.0
        with:
          service: ${{ format('{0}-frontend', env.APP_NAME) }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_ID }}/frontend:${{ env.IMAGE_TAG }}
          flags: "--service-account=${{ env.APP_NAME }}-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          secrets: |
            BACKEND_PROXY_TOKEN=${{ env.APP_NAME }}-backend-proxy-token:latest
            PUBLIC_FIREBASE_API_KEY=${{ env.APP_NAME }}-firebase-web-api-key:latest
            PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.APP_NAME }}-firebase-auth-domain:latest
          # Overwrite drops legacy secret mounts (e.g. app-auth / app-session) that no longer have IAM.
          secrets_update_strategy: overwrite
          env_vars_file: /tmp/frontend_cr_env.txt
          env_vars_update_strategy: overwrite
