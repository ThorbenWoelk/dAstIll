name: Validation

on:
  workflow_call:
    inputs:
      run_backend:
        description: Run backend validation jobs
        type: boolean
        required: false
        default: true
      run_frontend:
        description: Run frontend validation jobs
        type: boolean
        required: false
        default: true
      run_docs:
        description: Run docs validation jobs
        type: boolean
        required: false
        default: true
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  runtime-mode:
    name: Runtime Mode
    runs-on: ubuntu-latest
    outputs:
      app_runtime_mode: ${{ steps.mode.outputs.app_runtime_mode }}
      maintenance_mode: ${{ steps.mode.outputs.maintenance_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Resolve runtime mode
        id: mode
        run: |
          set -euo pipefail

          mode="$(sed -n 's/^APP_RUNTIME_MODE=//p' .github/runtime-mode.env | tail -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$mode" ]; then
            mode="live"
          fi

          maintenance_mode=false
          if [ "$mode" = "maintenance" ]; then
            maintenance_mode=true
          fi

          {
            echo "app_runtime_mode=$mode"
            echo "maintenance_mode=$maintenance_mode"
          } >> "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - runtime-mode

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Check forbidden tracked artifacts
        run: ./scripts/check_forbidden_artifacts.sh

  backend:
    name: Backend
    if: (github.event_name != 'workflow_call' || inputs.run_backend) && needs.runtime-mode.outputs.maintenance_mode != 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    timeout-minutes: 30
    needs:
      - repo-hygiene
      - runtime-mode

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Cargo Check
        working-directory: backend
        run: cargo check

      - name: Cargo Test
        working-directory: backend
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Cargo Audit
        working-directory: backend
        run: ./scripts/cargo_audit.sh

      - name: Build Release Binary
        working-directory: backend
        run: cargo build --release --bin dastill

      - name: Smoke Test - Binary Startup
        working-directory: backend
        timeout-minutes: 2
        run: |
          export BACKEND_PROXY_TOKEN="test"
          export GCP_PROJECT_ID="test"
          export YOUTUBE_API_KEY="test"
          export OLLAMA_URL="http://localhost:11434"
          export OLLAMA_API_KEY="test"
          export OLLAMA_SUMMARY_MODEL="glm-5.1:cloud"
          export SUMMARY_EVALUATOR_MODEL="gemma4:31b-cloud"
          export BACKEND_CORS_ALLOWED_ORIGINS="http://localhost:3000"
          export S3_DATA_BUCKET="test"
          export S3_VECTOR_BUCKET="test"
          export AWS_REGION="us-east-1"
          export AWS_ACCESS_KEY_ID="test"
          export AWS_SECRET_ACCESS_KEY="test"

          smoke_log="$(mktemp)"
          ./target/release/dastill >"$smoke_log" 2>&1 &
          smoke_pid=$!
          startup_ready=0
          exit_code=""

          for _ in $(seq 1 45); do
            if grep -q "initialization complete" "$smoke_log"; then
              startup_ready=1
              break
            fi

            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              wait "$smoke_pid" || exit_code=$?
              break
            fi

            sleep 1
          done

          if [ "$startup_ready" = "1" ]; then
            echo "Smoke test passed - binary initialized successfully"
            kill "$smoke_pid" 2>/dev/null || true
            wait "$smoke_pid" || true
            exit 0
          fi

          if [ -n "$exit_code" ]; then
            echo "Smoke test passed - binary failed early as expected without real credentials"
            exit 0
          fi

          echo "::error::Binary neither exited nor became ready within 45s"
          cat "$smoke_log"
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" || true
          exit 1

  frontend:
    name: Frontend
    if: github.event_name != 'workflow_call' || inputs.run_frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - repo-hygiene
      - runtime-mode

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend Format
        working-directory: frontend
        run: bun run format:check

      - name: Frontend Lint
        working-directory: frontend
        run: bun run lint

      - name: Frontend Check
        working-directory: frontend
        run: bun run check

      - name: Frontend Test
        working-directory: frontend
        run: bun run test

      - name: Frontend Audit
        working-directory: frontend
        run: bun audit --production

  docs:
    name: Docs
    if: github.event_name != 'workflow_call' || inputs.run_docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - repo-hygiene
      - runtime-mode

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Docs Dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Docs Build
        working-directory: docs
        run: bun run build

      - name: Docs Audit
        working-directory: docs
        run: bun audit --production
