name: Validation

on:
  workflow_call:
    inputs:
      run_all:
        description: Run every component validation job
        type: boolean
        required: false
        default: false
      run_backend:
        description: Run backend validation jobs
        type: boolean
        required: false
        default: false
      run_frontend:
        description: Run frontend validation jobs
        type: boolean
        required: false
        default: false
      run_docs:
        description: Run docs validation jobs
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Check forbidden tracked artifacts
        run: ./scripts/check_forbidden_artifacts.sh

  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - repo-hygiene
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      docs: ${{ steps.detect.outputs.docs }}
      any: ${{ steps.detect.outputs.any }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ALL: ${{ github.event_name == 'workflow_call' && inputs.run_all || false }}
          RUN_BACKEND: ${{ github.event_name == 'workflow_call' && inputs.run_backend || false }}
          RUN_FRONTEND: ${{ github.event_name == 'workflow_call' && inputs.run_frontend || false }}
          RUN_DOCS: ${{ github.event_name == 'workflow_call' && inputs.run_docs || false }}
        run: ./scripts/detect_changed_components.sh validation

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cargo Check
        working-directory: backend
        run: cargo check

      - name: Cargo Test
        working-directory: backend
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Cargo Audit
        working-directory: backend
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend Format
        working-directory: frontend
        run: bun run format:check

      - name: Frontend Lint
        working-directory: frontend
        run: bun run lint

      - name: Frontend Check
        working-directory: frontend
        run: bun run check

      - name: Frontend Test
        working-directory: frontend
        run: bun run test

      - name: Frontend Audit
        working-directory: frontend
        run: bun audit --production

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: needs.changes.outputs.docs == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Docs Dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Docs Build
        working-directory: docs
        run: bun run build

      - name: Docs Audit
        working-directory: docs
        run: bun audit --production
