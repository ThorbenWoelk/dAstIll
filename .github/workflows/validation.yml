name: Validation

on:
  workflow_call:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cargo Check
        working-directory: backend
        run: cargo check

      - name: Cargo Test
        working-directory: backend
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Cargo Audit
        working-directory: backend
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.0.1

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend Format
        working-directory: frontend
        run: bun run format:check

      - name: Frontend Lint
        working-directory: frontend
        run: bun run lint

      - name: Frontend Check
        working-directory: frontend
        run: bun run check

      - name: Frontend Test
        working-directory: frontend
        run: bun run test

      - name: Frontend Audit
        working-directory: frontend
        run: bun audit --production

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.0.1

      - name: Install Docs Dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Docs Build
        working-directory: docs
        run: bun run build

      - name: Docs Audit
        working-directory: docs
        run: bun audit --production
